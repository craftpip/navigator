name: navigator

services:
  navigator:
    container_name: "navigator"
    image: navigator:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile
    shm_size: "2gb"
    init: true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
        reservations:
          cpus: "4.0"
          memory: 4g

    volumes:
      - .:/app
      - /tmp/screenshots:/app/screenshots
      - chrome_profile_data:/data/chrome
    ports:
      - "${MCP_API_PORT:-1994}:${MCP_API_PORT:-1994}"
      - "${NOVNC_PORT:-1996}:${NOVNC_PORT:-1996}"
    stdin_open: true
    tty: true

volumes:
  chrome_profile_data:
    name: navigator_chrome_profile_data
